name: Deploy Futbol11 to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un grupo por rama o PR. Antes había un único grupo "pages" para todo, y
# GitHub solo deja una ejecución pendiente por grupo: un push a main cancelaba
# el CI de un PR que esperaba turno. En un PR, un push nuevo cancela el anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
      - name: Run QA suite
        run: npm run qa:ci
      - name: Run source lint
        run: npm run lint:src
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # URL /exec del ranking global (variable de repositorio, no secreto:
          # acaba en el JS público de todos modos). Solo en este paso: los QA
          # anteriores asumen "sin endpoint". Si la variable no existe, queda
          # vacía y el sitio muestra "Conecta el ranking global" como antes.
          VITE_GLOBAL_RANKING_ENDPOINT: ${{ vars.VITE_GLOBAL_RANKING_ENDPOINT }}
          # Analítica sin cookies (GoatCounter). Si la variable no existe, no se envía nada.
          VITE_ANALYTICS_HOST: ${{ vars.VITE_ANALYTICS_HOST }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npm run test:e2e
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Solo main publica. Lanzar el workflow a mano sobre otra rama
    # (gh workflow run deploy.yml --ref <rama>) ejecuta solo las comprobaciones.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Los despliegues a Pages van de uno en uno.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
