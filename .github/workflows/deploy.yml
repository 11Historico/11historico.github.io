name: Deploy Futbol11 to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
      - name: Run QA suite
        run: npm run qa:ci
      - name: Run source lint
        run: npm run lint:src
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # URL /exec del ranking global (variable de repositorio, no secreto:
          # acaba en el JS público de todos modos). Solo en este paso: los QA
          # anteriores asumen "sin endpoint". Si la variable no existe, queda
          # vacía y el sitio muestra "Conecta el ranking global" como antes.
          VITE_GLOBAL_RANKING_ENDPOINT: ${{ vars.VITE_GLOBAL_RANKING_ENDPOINT }}
          # Analítica sin cookies (GoatCounter). Si la variable no existe, no se envía nada.
          VITE_ANALYTICS_HOST: ${{ vars.VITE_ANALYTICS_HOST }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npm run test:e2e
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
